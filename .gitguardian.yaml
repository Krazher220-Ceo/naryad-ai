# Настройки сканера секретов GitGuardian.
# Демо-пароли для жюри публикуются намеренно: на странице /demo, в README и supabase/seed.sql.
# Данные в системе демонстрационные, а у демо-логинов пароль нельзя сменить или сбросить
# (lib/auth/roles.ts, DEMO_LOGINS). Настоящих ключей и паролей в репозитории нет: они в .env.
version: 2
secret:
  ignored_matches:
    - name: Демо-пароль мастера для жюри
      match: master2026
    - name: Демо-пароль исполнителя для жюри
      match: worker2026
    - name: Демо-пароль руководителя для жюри
      match: lead2026
    - name: Демо-пароль оператора для жюри
      match: operator2026
