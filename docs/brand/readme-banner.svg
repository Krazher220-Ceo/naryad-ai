<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>НарядAI — наряды на ремонт</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#001636"/><stop offset="1" stop-color="#07316e"/></linearGradient>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#fade)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#ffc107"/>
  <g transform="translate(56 50) scale(0.8) translate(-12 -8)" fill="#ffffff"><rect x="12" y="8" width="16" height="64" rx="4"/><rect x="52" y="8" width="16" height="64" rx="4"/><rect x="24" y="32" width="32" height="16"/></g>
  <rect x="120" y="62" width="3" height="40" fill="#ffc107"/>
  <text x="138" y="90" font-size="20" font-weight="600" fill="#b9c8e0">Qostanai AI Industry Hackathon 2026 · кейс №1</text>
  <text x="56" y="222" font-family="Oswald, 'Arial Narrow', Arial, sans-serif" font-size="104" font-weight="700" fill="#ffffff">Наряд<tspan fill="#ffc107">AI</tspan></text>
  <text x="60" y="276" font-size="24" fill="#d4e4fd">Наряды на ремонт: QR → мастер → исполнитель → ИИ-проверка</text>
  <text x="60" y="308" font-size="18" fill="#9fb4d6">Финальное решение всегда за человеком</text>
  <rect x="654" y="150" width="89" height="40" rx="20" fill="#dbeafe"/><text x="698.5" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Выдан</text><text x="757" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#ffc107">→</text><rect x="771" y="150" width="128" height="40" rx="20" fill="#fef3c7"/><text x="835" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">В работе</text><text x="913" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#ffc107">→</text><rect x="927" y="150" width="167" height="40" rx="20" fill="#d4e4fd"/><text x="1010.5" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#1753a9">Проверка ИИ</text><text x="1108" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#ffc107">→</text><rect x="1122" y="150" width="102" height="40" rx="20" fill="#dcfce7"/><text x="1173" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Закрыт</text>
  <text x="654" y="130" font-size="15" font-weight="700" letter-spacing="2" fill="#9fb4d6">ЖИЗНЬ НАРЯДА</text>
</svg>
